name: Validar solicitud

# Se ejecuta en cada Pull Request contra main, incluidas las que llegan
# de un fork (el repo es público). NO usa pull_request_target y NO
# tiene acceso a ningún secret ni a escritura: solo lee el diff con git
# y deja el informe como artefacto.
#
# GitHub le retira el permiso de escritura al token de este workflow
# cuando la PR viene de un fork, aunque se pida en "permissions" — por
# eso NO comenta aquí mismo. El comentario lo pone un segundo workflow,
# comentar-validacion.yml, que corre con el código de main (de
# confianza) y solo lee este artefacto, nunca código de la PR. Ver
# docs/PUBLICACION.md.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: validar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la Pull Request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Usar el validador de main (evita que una PR manipule su propia validación)
        run: git checkout ${{ github.event.pull_request.base.sha }} -- scripts/validar-pr.mjs

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/validar-pr.mjs

      - name: Guardar el número de la PR
        if: always()
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Subir el informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation-report.md
            pr-number.txt
          retention-days: 5
