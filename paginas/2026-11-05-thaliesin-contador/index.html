<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contador</title>
<meta name="autor" content="Thaliesin">
<meta name="description" content="Cuenta atrás con la molécula de tadalafilo de fondo, junto al simulador mecánico de la costocondritis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/paginas/2026-11-05-thaliesin-contador.css">
</head>
<body>

  <div class="rig">

    <!-- ========================= PANEL IZQUIERDO: CONTADOR ========================= -->
    <section class="panel panel-count" aria-label="Contador">

      <!-- Tadalafilo · C22H19N3O4, de fondo -->
      <div class="molecule" aria-hidden="true">
        <svg viewBox="58 12 374 344" preserveAspectRatio="xMidYMid meet" role="presentation">
          <g class="bonds">
            <!-- bencénico del indol -->
            <line x1="120" y1="158" x2="156.4" y2="179"/>
            <line x1="156.4" y1="179" x2="156.4" y2="221"/>
            <line x1="156.4" y1="221" x2="120" y2="242"/>
            <line x1="120" y1="242" x2="83.6" y2="221"/>
            <line x1="83.6" y1="221" x2="83.6" y2="179"/>
            <line x1="83.6" y1="179" x2="120" y2="158"/>
            <!-- pirrol del indol -->
            <line x1="156.4" y1="179" x2="196.3" y2="166"/>
            <line x1="196.3" y1="166" x2="221" y2="200"/>
            <line x1="221" y1="200" x2="202.18" y2="225.91"/>
            <line x1="186.79" y1="230.90" x2="156.4" y2="221"/>
            <!-- tetrahidropiridina (beta-carbolina) -->
            <line x1="221" y1="200" x2="262.77" y2="195.6"/>
            <line x1="262.77" y1="195.6" x2="275.78" y2="166.37"/>
            <line x1="273.97" y1="149.15" x2="255.16" y2="123.25"/>
            <line x1="255.16" y1="123.25" x2="213.39" y2="127.64"/>
            <line x1="213.39" y1="127.64" x2="196.3" y2="166"/>
            <!-- piperazina-2,5-diona -->
            <line x1="255.16" y1="123.25" x2="272.24" y2="84.89"/>
            <line x1="272.24" y1="84.89" x2="304.07" y2="81.55"/>
            <line x1="319.89" y1="88.59" x2="338.70" y2="114.49"/>
            <line x1="338.70" y1="114.49" x2="321.62" y2="152.85"/>
            <line x1="321.62" y1="152.85" x2="289.80" y2="156.20"/>
            <!-- N-metilo -->
            <line x1="318.08" y1="71.37" x2="331.09" y2="42.13"/>
            <!-- carbonilos (C=O) -->
            <line x1="274.67" y1="83.13" x2="255.85" y2="57.24"/>
            <line x1="269.81" y1="86.65" x2="250.99" y2="60.76"/>
            <line x1="319.19" y1="154.61" x2="338.01" y2="180.50"/>
            <line x1="324.05" y1="151.09" x2="342.87" y2="176.98"/>
            <!-- benceno del benzodioxol -->
            <line x1="262.77" y1="195.6" x2="287.48" y2="229.58"/>
            <line x1="287.48" y1="229.58" x2="329.25" y2="225.19"/>
            <line x1="329.25" y1="225.19" x2="353.94" y2="259.18"/>
            <line x1="353.94" y1="259.18" x2="336.86" y2="297.54"/>
            <line x1="336.86" y1="297.54" x2="295.09" y2="301.93"/>
            <line x1="295.09" y1="301.93" x2="270.40" y2="267.94"/>
            <line x1="270.40" y1="267.94" x2="287.48" y2="229.58"/>
            <!-- anillo dioxol (O-CH2-O) -->
            <line x1="353.94" y1="259.18" x2="385.75" y2="262.52"/>
            <line x1="397.77" y1="273.34" x2="404.43" y2="304.65"/>
            <line x1="404.43" y1="304.65" x2="376.71" y2="320.65"/>
            <line x1="360.62" y1="318.96" x2="336.86" y2="297.54"/>
            <!-- dobles enlaces aromáticos (línea interior) -->
            <line x1="147.10" y1="179.99" x2="123.80" y2="166.55"/>
            <line x1="89.10" y1="186.56" x2="89.10" y2="213.44"/>
            <line x1="123.80" y1="233.45" x2="147.10" y2="220.01"/>
            <line x1="212.10" y1="197.11" x2="196.29" y2="175.35"/>
            <line x1="295.57" y1="234.26" x2="322.31" y2="231.45"/>
            <line x1="345.84" y1="263.85" x2="334.91" y2="288.40"/>
            <line x1="295.10" y1="292.58" x2="279.30" y2="270.82"/>
          </g>
          <g class="atoms">
            <text x="196.3" y="234">N</text>
            <text x="196.3" y="252" class="small">H</text>
            <text x="279.85" y="157.24">N</text>
            <text x="314.01" y="80.5">N</text>
            <text x="247.54" y="50.91">O</text>
            <text x="346.32" y="186.83">O</text>
            <text x="395.69" y="263.56">O</text>
            <text x="368.05" y="325.65">O</text>
          </g>
        </svg>
      </div>

      <main class="stage">
        <h1 id="title" class="title" hidden></h1>

        <div id="clock" class="clock" role="timer" aria-live="off">
          <div class="unit">
            <span class="value" id="v-days">--</span>
            <span class="label">días</span>
          </div>

          <span class="sep" id="sep-hours" hidden>:</span>
          <div class="unit" id="u-hours" hidden>
            <span class="value" id="v-hours">--</span>
            <span class="label">horas</span>
          </div>

          <span class="sep">:</span>
          <div class="unit">
            <span class="value" id="v-minutes">--</span>
            <span class="label">minutos</span>
          </div>

          <span class="sep">:</span>
          <div class="unit">
            <span class="value" id="v-seconds">--</span>
            <span class="label">segundos</span>
          </div>
        </div>

        <p id="finished" class="finished" hidden></p>
        <p class="sr-only" id="live" aria-live="polite"></p>
      </main>

      <p class="panel-caption">Tadalafilo, C<sub>22</sub>H<sub>19</sub>N<sub>3</sub>O<sub>4</sub></p>
    </section>

    <!-- ============================ COSTURA CENTRAL ============================ -->
    <div class="seam" aria-hidden="true">
      <span class="rivet"></span>
      <span class="rivet"></span>
    </div>

    <!-- ===================== PANEL DERECHO: SIMULADOR MECÁNICO ===================== -->
    <section class="panel panel-anatomy" aria-label="Simulador mecánico de la costocondritis">
      <iframe
        class="anatomy-frame"
        src="ribcage-amortizer/ribcage-amortizer.html"
        title="The Ribcage Amortizer: simulador isométrico interactivo de la costocondritis"></iframe>
    </section>

  </div>

  <script src="/js/paginas/2026-11-05-thaliesin-contador.js"></script>
</body>
</html>
